<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYANK BETE 🔥</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.reel {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.reel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: zoom 4s infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(1.18); }
}

.top {
  position: absolute;
  top: 25px;
  width: 100%;
  text-align: center;
  color: yellow;
  font-size: 43px;
  font-weight: 1000;
  line-height: 1.5;
  letter-spacing: 5px;
  text-shadow: 3px 3px 10px red;
  animation: pop 0.8s infinite alternate;
}

.top span {
  display: block;
  color: white;
  font-size: 35px;
  letter-spacing: 9px;
}

.bottom {
  position: absolute;
  bottom: 12%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 29px;
  font-weight: 1000;
  text-shadow: 3px 3px 10px red;
  animation: pop 0.7s infinite alternate;
}

button {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: red;
  color: white;
  border: 2px solid white;
  border-radius: 30px;
  padding: 13px 25px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

@keyframes pop {
  from { scale: 1; }
  to { scale: 1.12; }
}
</style>
</head>

<body>

<div class="reel">

<img src="heera.jpg" alt="Meme">

<div class="top">
MAYANK
<span>BETE</span>
</div>

<div class="bottom">
गाड़ले मियां 😂<br>
गोप गोप गोप गोप 🔥
</div>

<button onclick="playVoice()">
🔊 PLAY VOICE
</button>

</div>

<script>
function playVoice() {
  speechSynthesis.cancel();

  let voice = new SpeechSynthesisUtterance(
    "Mayank bete! गाड़ले मियां! गोप गोप गोप गोप!"
  );

  voice.lang = "hi-IN";
  voice.rate = 0.85;
  voice.pitch = 1.3;
  voice.volume = 1;

  speechSynthesis.speak(voice);
}
</script>

</body>
</html>
